# Mantém o projeto Supabase (plano gratuito) ativo.
# O plano gratuito pausa o projeto depois de cerca de 7 dias sem atividade.
# Esta rotina faz uma consulta leve ao banco duas vezes por semana.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 11 * * 1,4'   # segunda e quinta, 11:17 UTC
  workflow_dispatch:           # também pode ser executada à mão na aba Actions

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "::warning::SUPABASE_URL / SUPABASE_ANON_KEY ainda não foram configurados nos Secrets do repositório. Nada a fazer."
            exit 0
          fi
          code=$(curl -s -o /tmp/out.txt -w '%{http_code}' --max-time 30 \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "${SUPABASE_URL%/}/rest/v1/keepalive?select=id&limit=1")
          echo "HTTP $code"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            echo "::error::O Supabase respondeu HTTP $code (projeto pausado, tabela 'keepalive' ausente ou chaves erradas)."
            exit 1
          fi
          echo "Supabase ativo."
