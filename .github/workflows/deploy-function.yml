# Publica a Edge Function do Ask Emma no Supabase sempre que o código dela mudar.
# Precisa do Secret SUPABASE_ACCESS_TOKEN (Supabase > Account > Access Tokens).
name: Deploy Supabase function

on:
  push:
    branches: [main]
    paths:
      - 'prompts.js'
      - 'edge/**'
      - 'scripts/build-edge.js'
      - 'supabase/functions/**'
      - 'supabase/config.toml'
      - '.github/workflows/deploy-function.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-function
  cancel-in-progress: false

env:
  PROJECT_REF: qzuislxznhbehcfkrdom
  FUNCTION_NAME: rapid-handler       # nome da função publicada no Supabase (o app chama este nome, veja docs/config.js)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check token
        id: tok
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::O Secret SUPABASE_ACCESS_TOKEN ainda não foi cadastrado. A função não foi publicada."
            echo "ok=no" >> "$GITHUB_OUTPUT"
          else
            echo "ok=yes" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v4
        if: steps.tok.outputs.ok == 'yes'
        with:
          node-version: 22

      - name: Build the function file
        if: steps.tok.outputs.ok == 'yes'
        run: |
          node scripts/build-edge.js
          mkdir -p "supabase/functions/$FUNCTION_NAME"
          cp supabase/functions/api/index.ts "supabase/functions/$FUNCTION_NAME/index.ts"

      - uses: supabase/setup-cli@v1
        if: steps.tok.outputs.ok == 'yes'
        with:
          version: latest

      - name: Deploy
        if: steps.tok.outputs.ok == 'yes'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy "$FUNCTION_NAME" --project-ref "$PROJECT_REF" --no-verify-jwt --use-api
