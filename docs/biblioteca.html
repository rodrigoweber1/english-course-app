<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script>/* carrega os arquivos do app com o número da versão no endereço: o navegador nunca mistura arquivo velho com versão nova */(function(){var v='';try{v=new URLSearchParams(location.search).get('v')||localStorage.getItem('ecasset')||''}catch(e){}window.__L=function(f){var q=v?'?v='+encodeURIComponent(v):'';document.write(/\.css$/.test(f)?'<link rel="stylesheet" href="'+f+q+'">':'<script src="'+f+q+'"><\/script>')}})()</script>
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#4F46E5">
<title>Library · Ask Enma</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Lexend:wght@400;500;600&display=swap">
<script>__L('common.css')</script>
<style>.tabs{display:flex;gap:6px;margin:8px 0}.tabs button.on{background:var(--primary);color:var(--on-primary);border-color:var(--primary)}.big{font-size:23px}</style>
<script>__L('theme.css')</script>
<script>__L('desktop.css')</script>
</head>
<body>
<div class="wrap">
<h1>Library</h1>
<div class="tabs" role="tablist"><button data-t="cards">Grammar cards</button><button data-t="vocab">Vocabulary</button><button data-t="errors">Errors</button></div>
<div id="view"></div>
</div>
<script>__L('config.js')</script>
<script>__L('common.js')</script>
<script>
EC.nav('biblioteca.html');
const view = document.getElementById('view');
let tab = 'cards';
const norm = s => (s||'').toLowerCase().replace(/[^a-z' ]/g,' ').split(/\s+/).filter(Boolean);
const similar = (a, b) => { const x = norm(a), y = new Set(norm(b)); return x.length ? x.filter(w => y.has(w)).length / Math.max(x.length, y.size) : 0; };
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => { tab = b.dataset.t; draw(); });
function draw(){ document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === tab)); ({cards, vocab, errors})[tab](); }
const due = l => l.filter(x => (x.due || '') <= EC.today());

function review(items, key, show, check, save){
  // Revisão oral com repetição espaçada
  let i = 0;
  const step = () => {
    if (i >= items.length) { view.innerHTML = '<div class="card"><b>Review complete.</b></div>'; setTimeout(draw, 1200); return; }
    const it = items[i];
    view.innerHTML = `<p class="muted">${i+1} of ${items.length}</p><div class="card">${show(it)}</div><div class="row"><button class="primary" id="say">Speak</button><button id="skip">Show answer</button></div><div id="fb"></div>`;
    const reveal = (txt) => {
      fb.innerHTML = `<div class="card">${txt}</div><p class="muted">How did it go?</p><div class="row"><button data-g="0">Wrong</button><button data-g="1">Hard</button><button data-g="2">Good</button><button data-g="3">Easy</button></div>`;
      fb.querySelectorAll('[data-g]').forEach(b => b.onclick = () => { EC.srsNext(it, +b.dataset.g); save(); i++; step(); });
    };
    say.onclick = async () => { say.disabled = true; try { const r = await EC.listen({ btn: say }); reveal(check(it, r.text)); } catch(e){ fb.innerHTML = `<p class="err">${EC.esc(e.message)}</p>`; } say.disabled = false; };
    skip.onclick = () => reveal(check(it, ''));
  };
  step();
}

function cards(){
  const all = EC.get('cards', []), d = due(all);
  view.innerHTML = `<p class="muted">${all.length} cards · ${d.length} due today. Cards come from the errors in your lesson reports.</p>
  ${d.length ? '<button class="primary" id="rev">Review aloud</button>' : ''}
  ${all.slice().reverse().map((c,i) => `<div class="card"><b>${EC.esc(c.title)}</b><p>${EC.diffHtml(c.wrong, c.right)}</p><p>${EC.esc(c.rule)}</p>${(c.examples||[]).map(e=>`<p class="muted">• ${EC.esc(e)}</p>`).join('')}<button data-sp="${EC.esc(c.right)}">Listen (UK)</button></div>`).join('') || '<p class="hint">No cards yet. Have a lesson and generate the report.</p>'}`;
  view.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => EC.speak(b.dataset.sp));
  if (window.rev) rev.onclick = () => review(d, 'cards', c => `<p class="hint">${EC.esc(c.title)}</p><p class="big">${EC.esc(c.wrong)}</p><p>Say the corrected sentence aloud.</p>`,
    (c, said) => `${said ? `You said: ${EC.esc(said)} (${Math.round(similar(c.right, said)*100)}% match)<br>` : ''}Correct: <ins>${EC.esc(c.right)}</ins><br>${EC.esc(c.rule)}`, () => EC.set('cards', all));
}
function vocab(){
  const all = EC.get('vocab', []), d = due(all), mastered = all.filter(v => (v.uses||0) >= 3).length;
  view.innerHTML = `<p class="muted">${all.length} expressions · ${mastered} mastered · ${d.length} due today.</p>
  <div class="row"><input type="text" id="nt" placeholder="New expression"><input type="text" id="nd" placeholder="Definition or example"><button id="add">Add</button></div>
  ${d.length ? '<p><button class="primary" id="rev">Review aloud</button></p>' : ''}
  <table>${all.slice().reverse().map(v => `<tr><td><b>${EC.esc(v.term)}</b><br><span class="muted">${EC.esc(v.definition||'')}</span></td><td>${(v.uses||0) >= 3 ? '<span class="pill okc">mastered</span>' : `<span class="pill">${v.uses||0}/3</span>`}</td><td><button data-sp="${EC.esc(v.example||v.term)}" aria-label="Listen">▶</button></td></tr>`).join('')}</table>`;
  view.querySelectorAll('[data-sp]').forEach(b => b.onclick = () => EC.speak(b.dataset.sp));
  add.onclick = () => { if (nt.value.trim()) { EC.addVocab([{ term: nt.value.trim(), definition: nd.value.trim(), example: '' }]); vocab(); } };
  if (window.rev) rev.onclick = () => review(d, 'vocab', v => `<p class="hint">Say the expression and a sentence of your own using it.</p><p class="big">${EC.esc(v.definition || v.example || '')}</p>`,
    (v, said) => `${said ? `You said: ${EC.esc(said)}<br>${norm(said).join(' ').includes(norm(v.term).join(' ')) ? '<span class="okc">You used the expression.</span>' : '<span class="err">I did not hear the expression.</span>'}<br>` : ''}Answer: <b>${EC.esc(v.term)}</b>${v.example ? '<br><i>' + EC.esc(v.example) + '</i>' : ''}`, () => EC.set('vocab', all));
}
function errors(){
  const all = EC.get('errors', []), pe = EC.persistentErrors(true), act = pe.filter(e => e.state !== 'resolved'), res = pe.filter(e => e.state === 'resolved'), train = EC.trainingErrors().map(e => e.key);
  const badge = e => ({ active:'Active', improving:`Improving ${e.clean}/3`, relapsed:'Relapsed', resolved:'Resolved ✓' }[e.state]);
  const card = e => `<div class="card">${EC.diffHtml(e.original, e.correction)}<br><span class="muted">${EC.esc(e.type)} · ${e.count} lessons</span> <span class="pill">${badge(e)}</span>${train.includes(e.key) ? ' <span class="pill">in training</span>' : ''}</div>`;
  view.innerHTML = `<h2>Persistent errors (3+ lessons)</h2><p class="hint">A mistake is resolved when you avoid it on your own in 3 different lessons. Enma trains at most 5 at a time.</p>${act.map(card).join('') || '<p class="hint">None so far.</p>'}${res.length ? `<h2>Resolved (${res.length})</h2>${res.map(card).join('')}` : ''}
  <h2>All errors (${all.length})</h2>${all.slice().reverse().slice(0, 60).map(e=>`<p>${EC.diffHtml(e.original, e.correction)}<br><span class="muted">${EC.esc(e.date)} · ${EC.esc(e.type||'')} · ${EC.esc(e.explanation||'')}</span></p>`).join('') || '<p class="hint">No errors recorded.</p>'}`;
}
draw();
</script>
</body>
</html>
