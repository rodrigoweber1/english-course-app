<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Writing · English Course</title>
<link rel="stylesheet" href="common.css">
<style>.cols{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.cols{grid-template-columns:1fr}}.sc{display:flex;justify-content:space-between;gap:8px}</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script src="common.js"></script>
<script>
EC.nav('escrita.html');
const app = document.getElementById('app');
// Tipos de texto do C1 Advanced em rotação; 1 de cada 4 tarefas é de mediação
const TASKS = [
 { kind:'essay', name:'Essay', task:'Write an essay on the following: "Remote work has made offices unnecessary." Discuss two of these points and say which you consider more important: productivity, social contact, work-life balance.', model:'Intro: state your position. Paragraph 1 and 2: one point each, with reasons and examples. Conclusion: say which is more important and why. Use linking words (Moreover, That said, Consequently).' },
 { kind:'email (informal)', name:'Informal email', task:'A friend from Britain is thinking of moving to your city. Write an email telling them what life there is really like, and give some advice.', model:'Friendly opening, 2–3 short paragraphs (cost of living, people, advice), warm closing. Contractions and phrasal verbs are fine.' },
 { kind:'report', name:'Report', task:'Your company is choosing a training course for the sales team. Write a report comparing two options and recommending one.', model:'Title, Introduction, Option 1, Option 2, Recommendation. Use headings and a neutral, impersonal tone.' },
 { kind:'letter (formal)', name:'Formal letter', task:'Write a letter to a newspaper editor responding to an article that claimed public transport should be free. Say whether you agree.', model:'Dear Sir or Madam, opening reason for writing, 2 paragraphs of argument, closing formula (Yours faithfully).' },
 { kind:'proposal', name:'Proposal', task:'Your town council wants to improve its leisure facilities. Write a proposal suggesting what to do with a limited budget.', model:'Introduction, Suggestions (with benefits), Costs, Conclusion. Persuasive but formal.' },
 { kind:'review', name:'Review', task:'Write a review of a film, series or album you have enjoyed recently, for a magazine. Say who you would recommend it to.', model:'Catchy title, short summary without spoilers, evaluation of strong and weak points, recommendation.' },
];
const MED = { kind:'mediation (summary email)', name:'Mediation', task:'Read the short text in Spanish or Portuguese below (or choose any article you like) and write an email in English to a colleague who does not speak that language, summarising the key points and what action is needed.', model:'Greeting, 3–4 key points in your own words (do not translate word by word), action needed, polite closing.' };
const hist = EC.get('writings', []);
function current(){ const n = hist.length + 1; return n % 4 === 0 ? MED : TASKS[(n - 1 - Math.floor(n / 4)) % TASKS.length]; }
const minWords = () => Math.min(220, 120 + hist.length * 15);
function home(){
  const tk = current();
  app.innerHTML = `<h1>This week's writing</h1><p class="muted">One task a week (~30 min), in the style of Cambridge C1 Advanced. Length target now: ${minWords()}–260 words (it rises to 220–260).</p>
  <div class="card"><span class="pill">${EC.esc(tk.name)}</span><p>${EC.esc(tk.task)}</p><p class="hint"><b>Recommended structure:</b> ${EC.esc(tk.model)}</p></div>
  <textarea id="t" aria-label="Your text" placeholder="Write here…"></textarea><p class="hint" id="wc">0 words</p>
  <div class="row"><button class="primary" id="go">Submit for marking</button></div><div id="out"></div>
  <h2>History</h2>${hist.slice().reverse().map(h => `<p>${h.date} · ${EC.esc(h.name)} · ${h.words} words · total score ${h.total}/20</p>`).join('') || '<p class="hint">No tasks yet.</p>'}`;
  t.oninput = () => wc.textContent = words(t.value) + ' words';
  go.onclick = () => submit(t, document.getElementById('out'), document.getElementById('go'));
}
const words = s => s.trim() ? s.trim().split(/\s+/).length : 0;
async function submit(box, out, btn){
  const text = box.value, task = current();
  if (words(text) < 40) { out.innerHTML = '<p class="err">Please write at least 40 words.</p>'; return; }
  out.innerHTML = '<p class="muted">Marking…</p>'; btn.disabled = true;
  try {
    const r = await EC.evaluate('cambridge_writing', { kind: task.kind, task: task.task, text });
    const S = r.scores, names = { content:'Content', communicative:'Communicative achievement', organisation:'Organisation', language:'Language' };
    const total = Object.values(S).reduce((a,x)=>a+x.score,0);
    const id = 'escrita-' + EC.today() + '-' + Date.now();
    EC.addErrors(r.errors, id);
    hist.push({ date: EC.today(), name: task.name, words: words(text), total, scores: Object.fromEntries(Object.entries(S).map(([k,v])=>[k,v.score])) }); EC.set('writings', hist);
    out.innerHTML = `<div class="card"><b>Score: ${total}/20</b>${Object.entries(S).map(([k,v])=>`<p class="sc"><span>${names[k]}: <b>${v.score}/5</b></span><span class="muted">${EC.esc(v.comment)}</span></p>`).join('')}</div>
      <h2>Your text and the corrected version</h2><div class="cols"><div class="card"><b>Your text</b><p>${EC.esc(text).replace(/\n/g,'<br>')}</p></div><div class="card"><b>Corrected</b><p>${EC.diffHtml(text.replace(/\s+/g,' '), (r.corrected||'').replace(/\s+/g,' '))}</p></div></div>
      <p class="hint"><del>removed</del> / <ins>added</ins></p>
      <h2>Compulsory rewrite</h2><p class="muted">Rewrite the marked sentences. The AI checks whether they are now correct.</p>
      <div id="rw">${(r.errors||[]).slice(0,8).map((e,i)=>`<div class="card"><p>${EC.esc(e.original)}</p><p class="hint">${EC.esc(e.type)}: ${EC.esc(e.explanation)}</p><input type="text" data-i="${i}" style="width:100%" aria-label="Rewrite the sentence"></div>`).join('') || '<p class="hint">No marked errors.</p>'}</div>
      <button id="chk" class="primary">Check my rewrite</button><div id="chkout"></div><p class="hint">In your next lesson, Emma will ask you to defend the ideas in your text aloud.</p>`;
    EC.set('lastWriting', { date: EC.today(), task: task.task, text: text.slice(0, 1500) });
    if (window.chk) chk.onclick = async () => {
      const items = [...rw.querySelectorAll('input')].map(inp => ({ original: r.errors[inp.dataset.i].original, correction: r.errors[inp.dataset.i].correction, rewrite: inp.value }));
      chkout.innerHTML = '<p class="muted">Checking…</p>';
      try { const c = await EC.evaluate('rewrite_check', { items }); chkout.innerHTML = (c.results||[]).map((x,i)=>`<p class="${x.ok?'okc':'err'}">${i+1}. ${x.ok?'Correct':'Not yet'} — ${EC.esc(x.comment)}</p>`).join(''); } catch(e){ chkout.innerHTML = `<p class="err">${EC.esc(e.message)}</p>`; }
    };
  } catch(e){ out.innerHTML = `<p class="err">${EC.esc(e.message)}</p>`; }
  btn.disabled = false;
}
home();
</script>
</body>
</html>
