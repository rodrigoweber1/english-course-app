<style>
  :root{--bg:#F8FAFC;--fg:#0F172A;--card:#FFFFFF;--muted:#475569;--border:#CBD5E1;--primary:#2563EB;--on-primary:#FFFFFF;--tint:#EFF6FF}
  @media (prefers-color-scheme: dark){:root{--bg:#0B1220;--fg:#E2E8F0;--card:#111A2E;--muted:#A3B1C6;--border:#26334D;--primary:#3B82F6;--tint:#14233F}}

  button.primary{background:var(--primary);color:var(--on-primary);border-color:var(--primary);font-weight:600}

<div class="bar"><div>
  <button id="back">Back</button>
  <span class="step" id="step"></span>
  <button class="primary" id="next">Continue</button>
</div></div>

<script>__L('config.js')</script>
<script>__L('common.js')</script>
<script>
EC.nav('interesses.html');
const KEY = 'ec_interests';
// Áreas gerais e perguntas concretas de cada área (seção 2.1 da especificação)
const AREAS = {
  'Current affairs': ['Politics and society','Technology and science','Environment','Health and wellbeing','Education'],
  'Business and economics': ['Sales and negotiation','Leadership and career','Entrepreneurship','Personal finance','Marketing'],
  'Music': ['British rock and pop','Brazilian and Latin music (interviews and documentaries in English)','Jazz and classical','Electronic music','Hip-hop'],
  'Film and TV': ['Drama and thriller','Documentaries','Comedy','Science fiction','British series'],
  'Sport': ['Tennis','Running and cycling','Football','Formula 1','Gym and fitness'],
  'Other leisure topics': ['Travel','Food and cooking','Books','Photography','Video games'],
};
const FIXED = {
  'Preferred type of audio': ['Interviews and discussions','Narrated stories','Popular science and culture','Humour and comedy'],
  'Role-play situations': ['Work meetings','Social conversation and networking','Opinion debates','Job interviews','Negotiation'],
};
const areaNames = Object.keys(AREAS);
let saved = {}; try { saved = JSON.parse(localStorage.getItem(KEY) || '{}'); } catch {}
let state = { areas: saved.areas || [], picks: saved.picks || {} };
let step = 0; // 0 = áreas, 1 = detalhes, 2 = resumo

const app = document.getElementById('app'), nextB = document.getElementById('next'), backB = document.getElementById('back');
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function group(title, hint, options, name){
  const sel = state.picks[name] || [];
  return `<h2>${esc(title)}</h2>${hint ? `<p>${esc(hint)}</p>` : ''}<div class="opts" data-group="${esc(name)}">` +
    options.map(o => `<label><input type="checkbox" value="${esc(o)}" ${sel.includes(o)?'checked':''}><span>${esc(o)}</span></label>`).join('') + '</div>';
}
function render(){
  backB.style.visibility = 'visible'; backB.textContent = step === 0 ? 'Back' : step === 2 ? 'Edit' : 'Back';
  document.getElementById('step').textContent = `Step ${step+1} of 3`;
  if (step === 0){
    app.innerHTML = `<h1>What are you into?</h1><p>Choose the areas that interest you most. Emma uses these topics for audio, debates and role-plays. You can change them whenever you like.</p>` +
      `<div class="opts" id="areas">` + areaNames.map(a => `<label><input type="checkbox" value="${esc(a)}" ${state.areas.includes(a)?'checked':''}><span>${esc(a)}</span></label>`).join('') + '</div>';
    nextB.textContent = 'Continue'; nextB.disabled = state.areas.length === 0;
    app.querySelectorAll('#areas input').forEach(i => i.onchange = () => {
      state.areas = [...app.querySelectorAll('#areas input:checked')].map(x => x.value); nextB.disabled = state.areas.length === 0;
    });
  } else if (step === 1){
    app.innerHTML = `<h1>Now, some details</h1><p>Tick what suits you best in each area.</p>` +
      state.areas.map(a => group(a, '', AREAS[a], a)).join('') +
      Object.entries(FIXED).map(([t,o]) => group(t, 'You can tick more than one.', o, t)).join('');
    nextB.textContent = 'Save'; nextB.disabled = false;
    app.querySelectorAll('.opts[data-group] input').forEach(i => i.onchange = () => {
      const g = i.closest('.opts').dataset.group;
      state.picks[g] = [...i.closest('.opts').querySelectorAll('input:checked')].map(x => x.value);
    });
  } else {
    const all = [...state.areas, ...Object.keys(FIXED)];
    app.innerHTML = `<h1>All saved</h1><p>These are your interests:</p>` +
      all.map(g => `<h2>${esc(g)}</h2><p style="color:var(--fg)">${(state.picks[g]||[]).map(esc).join(' · ') || '—'}</p>`).join('');
    backB.textContent = 'Edit'; nextB.textContent = 'Go to the lesson'; nextB.disabled = false;
  }
  window.scrollTo(0,0);
}
function save(){
  // Mantém só as respostas das áreas escolhidas
  const keep = [...state.areas, ...Object.keys(FIXED)];
  const picks = {}; keep.forEach(k => picks[k] = state.picks[k] || []);
  state.picks = picks;
  try { localStorage.setItem(KEY, JSON.stringify({ areas: state.areas, picks, updated: new Date().toISOString() })); } catch {}
}
nextB.onclick = () => {
  if (step === 2) { location.href = 'index.html'; return; }
  if (step === 1) save();
  step++; render();
};
backB.onclick = () => {
  if (step === 0) { if (history.length > 1 && document.referrer.startsWith(location.origin)) history.back(); else location.href = 'index.html'; return; }
  if (step === 2) step = 1; else step--; render();
};
render();
</script>
</body>
</html>
