EC.nav('prova.html');
const LV = ['B1','B2','C1','C2'];
// Banco de perguntas (britânico). Cada nível tem 5.
const BANK = [
 // B1
 ['If I ___ more time, I would learn Italian.', ['had','have','would have','having'], 0, 0],
 ['She has lived here ___ 2019.', ['since','for','from','during'], 0, 0],
 ["I'm not used ___ getting up so early.", ['to','for','with','at'], 0, 0],
 ['The film was ___ boring that we left halfway through.', ['so','such','too','very'], 0, 0],
 ['He asked me where ___.', ['I lived','did I live','do I live','I live'], 0, 0],
 // B2
 ['By the time we arrived, the film ___.', ['had already started','already started','has already started','was already start'], 0, 1],
 ['I wish I ___ harder when I was at school.', ['had studied','studied','would study','have studied'], 0, 1],
 ['She suggested ___ a taxi.', ['taking','to take','take','that to take'], 0, 1],
 ["You ___ have told me earlier! Now it's too late.", ['should','might','can','must'], 0, 1],
 ['The company decided to ___ the launch until next spring.', ['put off','put away','put out','put down'], 0, 1],
 // C1
 ['Not only ___ late, but he also forgot the documents.', ['did he arrive','he arrived','he did arrive','arrived he'], 0, 2],
 ['It was the manager ___ made the final decision.', ['who','whom','which','whose'], 0, 2],
 ['Had I known about the delay, I ___ earlier.', ['would have left','would leave','had left','left'], 0, 2],
 ['___ the evidence, the committee reached no conclusion.', ['Despite having reviewed','In spite having','Although reviewing','Notwithstanding of'], 0, 2],
 ['Her argument was so ___ that nobody could find a flaw in it.', ['watertight','waterproof','seaworthy','airborne'], 0, 2],
 // C2
 ['Hardly ___ the building when the alarm went off.', ['had she entered','she had entered','did she enter','she entered'], 0, 3],
 ["He's a bit of a ___: he never commits to anything.", ['fence-sitter','bystander','hanger-on','stand-in'], 0, 3],
 ["I'd rather you ___ anyone about this for the time being.", ["didn't tell","don't tell","won't tell","haven't told"], 0, 3],
 ['The proposal, ___ merits are debatable, was approved.', ['whose','of which the','which','that its'], 0, 3],
 ['She was ___ to the notion that remote work could be as productive.', ['averse','adverse','aversive','avert'], 0, 3],

 // B1 (mais)
 ['If it rains tomorrow, we ___ at home.', ['will stay','would stay','stayed','are staying not'], 0, 0],
 ['My sister is ___ than me.', ['taller','more tall','the tallest','tall'], 0, 0],
 ['I have never ___ sushi.', ['eaten','ate','eat','eating'], 0, 0],
 ['She asked me ___ I wanted a coffee.', ['if','that','what','to'], 0, 0],
 ['We were late ___ the traffic.', ['because of','because','so','although'], 0, 0],
 ['You ___ wear a seat belt. It is the law.', ['must','might','may','would'], 0, 0],
 ['He ___ TV when the phone rang.', ['was watching','watched','has watched','watches'], 0, 0],
 // B2 (mais)
 ['If I had known about the meeting, I ___ there.', ['would have been','would be','had been','will be'], 0, 1],
 ['The documents ___ before the meeting starts.', ['must be signed','must sign','must be signing','must have sign'], 0, 1],
 ['He denied ___ the window.', ['breaking','to break','break','to have break'], 0, 1],
 ["I'm looking forward ___ you next week.", ['to seeing','to see','for seeing','seeing'], 0, 1],
 ['The house ___ we grew up has been sold.', ['where','which','whose','who'], 0, 1],
 ['Despite ___ hard, he failed the exam.', ['studying','he studied','to study','of studying'], 0, 1],
 ['The meeting was called ___ because of the strike.', ['off','up','out','down'], 0, 1],
 // C1 (mais)
 ['Rarely ___ such a talented young player.', ['have I seen','I have seen','did I saw','I saw'], 0, 2],
 ["I'd sooner ___ than apologise.", ['resign','to resign','resigning','resigned'], 0, 2],
 ['It is high time the government ___ action.', ['took','takes','will take','take'], 0, 2],
 ['She was deliberately ___ about her plans.', ['vague','vagrant','vacant','vain'], 0, 2],
 ['He made a ___ effort to hide his disappointment.', ['valiant','valuable','valid','vital'], 0, 2],
 ['The more she practised, ___ she became.', ['the more confident','more confident','the most confident','as confident'], 0, 2],
 ['He is said ___ the company in 1998.', ['to have founded','to found','founding','that he founded'], 0, 2],
 // C2 (mais)
 ['Little ___ that the decision would change her life.', ['did she know','she knew','she did know','knew she'], 0, 3],
 ["The minister's apology was widely seen as ___, offered only after the scandal broke.", ['disingenuous','ingenuous','ingenious','indigenous'], 0, 3],
 ['He was ___ of any wrongdoing by the inquiry.', ['exonerated','exhorted','exacerbated','exasperated'], 0, 3],
 ["Not until the final chapter ___ the narrator's motive revealed.", ['is','does','are','it is'], 0, 3],
 ['The new law has ___ implications for small businesses.', ['far-reaching','long-reached','wide-going','broad-gone'], 0, 3],
 ['She has an uncanny ___ for remembering names.', ['knack','nick','nack','knock'], 0, 3],
 ['The committee insisted that the report ___ revised.', ['be','is','was','being'], 0, 3],
].map(([q,o,c,l]) => ({ q, o, c, l }));

const READING = {
  texts: [
    { text: `Night trains were once considered a relic of the past. Budget airlines made it cheaper and faster to fly between European capitals, and many overnight services were quietly closed. Yet over the last few years the sleeper train has made an unexpected comeback. Several countries have ordered new carriages, and tickets for popular routes often sell out weeks in advance.

Supporters say there are two main reasons for the revival. The first is environmental: a journey by rail produces far less carbon dioxide than the same trip by plane, and more travellers are now willing to take this into account. The second is simply convenience. Passengers go to bed in the city centre and wake up in another country, saving the cost of a hotel night and avoiding the long journey to and from airports.

However, the trains are not a perfect solution. Tickets are frequently more expensive than a cheap flight, and the older carriages can be noisy and cramped. Rail companies also point out that crossing borders is complicated, because each country has its own safety rules and signalling systems. "People love the idea," one operator admitted, "but the practical details are still our biggest challenge."`,
      qs: [
        { q: 'Why were many night trains closed?', o: ['Planes became cheaper and quicker', 'Passengers disliked sleeping on trains', 'New safety rules were introduced', 'Governments stopped paying for rail'], c: 0 },
        { q: 'Besides the environment, what advantage of sleeper trains does the text mention?', o: ['They avoid crossing any borders', 'They are quieter than older trains', 'They can save the cost of a hotel night', 'They are always cheaper than flying'], c: 2 },
        { q: 'What does the writer say about ticket prices?', o: ['They are lower than for any flight', 'They are often higher than cheap flights', 'They have fallen over the last years', 'They are the same in every country'], c: 1 },
        { q: "What does the operator's comment suggest?", o: ['The idea is popular, but running services across borders is hard', 'Nobody really wants to travel by night train any more', 'The new carriages have solved all the problems', 'Passengers complain mainly about the ticket prices'], c: 0 }
      ] },
    { text: `Experts are often assumed to make the best teachers, but research on what psychologists call the "curse of knowledge" suggests otherwise. Once we have mastered a skill, we find it almost impossible to remember what it felt like not to understand it. Steps that have become automatic seem too obvious to mention, and the expert unconsciously skips them, leaving the learner to guess at the missing links.

A well-known experiment illustrates the problem. Participants were asked to tap out the rhythm of a famous song on a table while a listener tried to name it. The tappers predicted that about half of their listeners would succeed; in reality, fewer than three in a hundred did. Because the tappers could hear the melody in their heads, they could not imagine how meaningless the taps sounded without it.

This does not mean that expertise is a handicap. Rather, it suggests that effective teaching requires a deliberate effort to reconstruct the beginner's perspective. Some universities now encourage lecturers to test their explanations on newcomers to the subject, and to treat the questions they receive as data rather than as signs of inattention. The most successful instructors, it turns out, are rarely those who know the most, but those who remain curious about why a concept is difficult.

Importantly, the effect is not limited to the classroom: managers explaining a new procedure and doctors describing a diagnosis can fall into the same trap.`,
      qs: [
        { q: 'What is the main point of the first paragraph?', o: ['Mastering a skill makes it hard to recall being a beginner', 'Experts should avoid teaching beginners altogether', 'Learners usually guess the missing steps correctly', 'Automatic skills are easier to explain to others'], c: 0 },
        { q: 'What does the tapping experiment show?', o: ['Listeners are good at recognising rhythms', 'People overestimate how clear their own knowledge is to others', 'Famous songs are easy to tap out accurately', 'Half of all listeners can name a song from taps'], c: 1 },
        { q: "Which best describes the writer's view of expertise?", o: ['It is a handicap that teachers should hide', 'It matters less than curiosity and enthusiasm', 'It is valuable but must be combined with beginner-awareness', 'It is overrated by most psychologists today'], c: 2 },
        { q: 'What are some universities encouraging lecturers to do?', o: ['Avoid questions that suggest inattention', 'Treat newcomers\' questions as useful information', 'Reduce the amount of material they explain', 'Hire instructors who know the most'], c: 1 },
        { q: 'What does the final paragraph suggest about the problem?', o: ['It affects other kinds of professional communication', 'It is limited to classrooms and universities', 'It can be solved by using simpler procedures', 'It mainly affects managers rather than doctors'], c: 0 }
      ] }
  ]
};
// Pontuação: o texto 1 (nível B2) decide se a pessoa está em B1, B2 ou acima; o texto 2 (nível C1) só pesa muito quando o 1 foi bem
const readingScore = (a, b) => { const base = [0.5, 0.5, 1, 1.4, 1.8][a], bonus = a >= 3 ? [0, 0, .1, .4, .8, 1.2][b] : [0, 0, 0, .1, .2, .3][b]; return Math.min(3, base + bonus); };
const WPROMPT = 'Some people think that city centres should be closed to private cars. To what extent do you agree? Write 120–150 words.';

const CP = +new URLSearchParams(location.search).get('checkpoint') || 0;   // semana do checkpoint (0 = prova de nível inicial)
const DRAFT = CP ? 'checkpoint_draft' : 'placement_draft';
// Cronômetro de cada parte (a prova toda dura no máximo 27 minutos: 6 + 7 + 15 + 10 = 38, mais a correção pela IA)
let TM = null;
function stopTimer(){ clearInterval(TM); TM = null; const e = document.getElementById('tmr'); if (e) e.remove(); }
function startTimer(min, onEnd){
  stopTimer();
  const until = Date.now() + min * 60000; const e = document.createElement('div');
  e.id = 'tmr'; e.className = 'pill'; e.setAttribute('role', 'timer'); e.setAttribute('aria-label', 'Time left in this part');
  e.style.cssText = 'position:fixed;right:12px;top:78px;z-index:15;background:var(--card);font-variant-numeric:tabular-nums;font-weight:600';
  const tx = document.createElement('span');
  e.append(tx); document.body.appendChild(e);
  const tick = () => {
    const s = Math.max(0, Math.round((until - Date.now()) / 1000));
    tx.textContent = 'Time left ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
    e.style.color = s <= 60 ? 'var(--danger)' : '';
    if (s <= 0) { stopTimer(); onEnd(); }
  };
  tick(); TM = setInterval(tick, 500);
}

let res = EC.get(DRAFT, {});
const app = document.getElementById('app');
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };

// Sair de uma parte e voltar à lista de partes (pergunta antes só se houver algo feito que se perderia)
function leave(hasProgress){ if (hasProgress && !confirm('Go back to the parts list? What you did in this part will not be saved.')) return; intro(); }
function intro(){
  stopTimer();
  EC.cloudPush();   // guarda na nuvem o que já foi feito (as partes concluídas)
  const last = EC.get('level', null);
  const hs = EC.get('level_history', []), prevL = hs.length ? hs[hs.length-1] : null;
  const nextK = ['grammar','reading','writing','speaking'].find(k => !res[k]);
  const dn = k => res[k] ? ' <span class="pill donepill">✓ Done</span>' : '';
  app.innerHTML = `<h1>${CP ? 'Checkpoint test · week ' + CP : 'Placement test'}</h1>
  <p>${CP ? 'A progress check, same format as the placement test. It shows how far you have come. Your study plan stays as it is.' : 'Measures your real level (B1 to C2). It is adaptive: questions get harder or easier depending on your answers. It takes about <b>38 minutes</b>, and you can do it in two sittings, even on different days: <b>parts 1 and 2</b> (about 13 min) and <b>parts 3 and 4</b> (about 25 min). Each part has its own clock, and the part ends by itself when time is up.'}</p>
  <div class="row">${[['g1','grammar','1. Grammar and vocabulary'],['g2','reading','2. Reading'],['g3','writing','3. Writing'],['g5','speaking','4. Speaking']].map(([id,k,t]) => `<button id="${id}" class="${res[k] ? 'donebtn' : ''}" ${res[k] ? 'aria-label="' + t + ', done"' : (k === nextK ? 'aria-label="' + t + ', next"' : '')}>${res[k] ? '✓ ' : (k === nextK ? '→ ' : '')}${t}</button>`).join('')}<button id="gr" ${nextK ? '' : 'aria-label="See result, next"'}>${nextK ? '' : '→ '}See result</button></div>
  ${CP && prevL ? `<div class="card"><b>Your last measured level:</b> ${EC.esc(prevL.overall)} · ${EC.esc(prevL.date)}</div>` : (last ? `<div class="card"><b>Last result:</b> ${EC.esc(last.overall)} · ${EC.esc(last.date)}</div>` : '')}
  <div class="card"><b>Parts</b><ol>
   <li>Grammar and vocabulary (up to 6 min)${dn('grammar')}</li><li>Reading (up to 7 min, two texts)${dn('reading')}</li><li>Writing (up to 15 min, AI marking)${dn('writing')}</li>
   <li>Speaking: interview with Enma (up to 10 min, AI)${dn('speaking')}</li></ol>
   <p class="hint">Listening is a separate free test (EF SET); you will find it on the result page. You can do some parts now and continue later.</p></div>`;
  g1.onclick = grammar; g2.onclick = reading; g3.onclick = writing; g5.onclick = speaking; gr.onclick = result;
}

// 1. Gramática e vocabulário adaptativos
function grammar(){
  const used = new Set(); let L = 1, n = 0, hist = [];
  const next = () => {
    if (n >= 10) return end();
    const pool = BANK.map((b,i)=>[b,i]).filter(([b,i]) => b.l === L && !used.has(i));
    const fallback = BANK.map((b,i)=>[b,i]).filter(([b,i]) => !used.has(i)).sort((a,b)=>Math.abs(a[0].l-L)-Math.abs(b[0].l-L));
    const [b,i] = pool.length ? pool[Math.floor(Math.random()*pool.length)] : fallback[0];
    used.add(i); n++;
    const opts = shuffle(b.o.map((t,k)=>({t,ok:k===b.c})));
    app.innerHTML = `<p class="muted">Question ${n} of 10</p><div class="pbar"><i style="width:${n/10*100}%"></i></div><h2>${EC.esc(b.q)}</h2><div class="opts">${opts.map((o,k)=>`<button data-k="${k}">${EC.esc(o.t)}</button>`).join('')}</div><p><button type="button" id="bk">← Back to parts</button></p>`;
    bk.onclick = () => leave(n > 1);
    app.querySelectorAll('.opts button').forEach(btn => btn.onclick = () => {
      const ok = opts[btn.dataset.k].ok; hist.push({ level:b.l, ok });
      L = Math.max(0, Math.min(3, L + (ok ? 1 : -1))); next();
    });
  };
  const end = () => {
    stopTimer(); if (!hist.length) return intro();
    const last = hist.slice(-8), mean = last.reduce((a,h)=>a+h.level+(h.ok?0.25:-0.25),0)/last.length;
    res.grammar = { score: Math.max(0, Math.min(3, mean)), correct: hist.filter(h=>h.ok).length, total: hist.length };
    EC.set(DRAFT, res); app.innerHTML = `<h1>Part 1 complete</h1><p>Correct answers: ${res.grammar.correct} of ${res.grammar.total}. Estimated level: <b>${label(res.grammar.score)}</b>.</p><button class="primary" onclick="intro()">Continue</button>`;
  };
  startTimer(6, end); next();
}
// Tabela com a nota de cada critério (vinda da IA): mostra em que a pessoa foi bem e onde perdeu nível
const crit = o => o && typeof o === 'object' ? '<table class="crit" aria-label="Level by criterion">' + Object.entries(o).map(([k, v]) => '<tr><td>' + EC.esc(k.charAt(0).toUpperCase() + k.slice(1)) + '</td><td><b>' + EC.esc(String(v)) + '</b></td></tr>').join('') + '</table>' : '';
// A IA avalia duas vezes e a nota final é a média: reduz o efeito de uma correção mais dura ou mais branda por acaso
async function markTwice(task, payload){
  const [r1, r2] = await Promise.all([EC.evaluate(task, payload), EC.evaluate(task, payload).catch(() => null)]);
  const i1 = Math.max(0, LV.indexOf(r1.cefr)), i2 = r2 ? Math.max(0, LV.indexOf(r2.cefr)) : i1, score = (i1 + i2) / 2;
  return { r: r1, score, cefr: i1 === i2 ? LV[i1] : label(score) };
}
const label = s => { const i = Math.max(0, Math.min(3, Math.floor(s + 0.0001))); const hi = s - Math.floor(s) >= .5; return LV[i] + (hi && i < 3 ? '+' : ''); };

// 2. Leitura: dois textos (o 2.º mais difícil), 9 perguntas, 7 minutos
function reading(){
  let n = 0, html = '<h1>Reading</h1><p class="hint">Two short texts. The second one is harder. Choose one answer for each question.</p>';
  READING.texts.forEach((T, ti) => {
    html += `<div class="card"><h2 style="margin-top:0">Text ${ti + 1}</h2>${T.text.split('\n\n').map(x => '<p>' + EC.esc(x) + '</p>').join('')}</div>`;
    T.qs.forEach((q, qi) => { n++; html += `<h2>${n}. ${EC.esc(q.q)}</h2><div class="opts" data-t="${ti}" data-q="${qi}">${q.o.map((o, k) => `<button data-k="${k}">${EC.esc(o)}</button>`).join('')}</div>`; });
  });
  html += `<p class="row"><button class="primary" id="fin">Finish</button><button type="button" id="bk">← Back to parts</button></p>`; app.innerHTML = html;
  const ans = {};
  bk.onclick = () => leave(Object.keys(ans).length > 0);
  startTimer(7, () => fin.onclick());
  app.querySelectorAll('.opts button').forEach(b => b.onclick = () => { const g = b.parentElement; g.querySelectorAll('button').forEach(x => x.classList.remove('sel')); b.classList.add('sel'); ans[g.dataset.t + '-' + g.dataset.q] = +b.dataset.k; });
  fin.onclick = () => {
    stopTimer();
    const ok = READING.texts.map((T, ti) => T.qs.filter((q, qi) => ans[ti + '-' + qi] === q.c).length);
    const total = ok[0] + ok[1], max = READING.texts[0].qs.length + READING.texts[1].qs.length;
    res.reading = { score: readingScore(ok[0], ok[1]), correct: total, total: max, byText: ok };
    EC.set(DRAFT, res);
    app.innerHTML = `<h1>Part 2 complete</h1><p>Correct answers: ${total} of ${max} (text 1: ${ok[0]} of ${READING.texts[0].qs.length}; text 2, harder: ${ok[1]} of ${READING.texts[1].qs.length}). Estimated level: <b>${label(res.reading.score)}</b>.</p><button class="primary" onclick="intro()">Continue</button>`;
  };
}

// 3. Escrita (IA)
function writing(){
  app.innerHTML = `<h1>Writing</h1><div class="card">${EC.esc(WPROMPT)}</div><textarea id="t" aria-label="Your text"></textarea><p class="hint" id="wc">0 words</p><div class="row"><button class="primary" id="go">Submit for marking</button><button type="button" onclick="intro()">← Back to parts</button></div><p class="hint">Your text is saved while you type, so you can come back to it.</p><div id="out"></div>`;
  const WD = 'writing_text_' + DRAFT;   // o texto é guardado a cada tecla: nunca se perde ao sair, recarregar ou acabar o tempo
  const count = () => wc.textContent = (t.value.trim() ? t.value.trim().split(/\s+/).length : 0) + ' words';
  t.value = EC.get(WD, ''); count();
  t.oninput = () => { count(); EC.set(WD, t.value); };
  startTimer(15, () => { if (!go.disabled) { if (t.value.trim()) { out.innerHTML = '<p class="muted">Time is up. Sending what you wrote…</p>'; go.click(); } else intro(); } });
  go.onclick = async () => {
    stopTimer();
    out.innerHTML = '<p class="muted">Marking…</p>'; go.disabled = true;
    try {
      const m = await markTwice('placement_writing', { prompt: WPROMPT, text: t.value }), r = m.r;
      res.writing = { score: m.score, cefr: m.cefr, data: r, text: t.value }; EC.set(DRAFT, res); EC.set(WD, '');
      EC.addErrors(r.errors, 'prova-' + EC.today());
      out.innerHTML = `<div class="card"><b>Writing level: ${EC.esc(m.cefr)}</b>${crit(r.criteria)}<p>Strengths: ${(r.strengths||[]).map(EC.esc).join('; ')}</p><p>To improve: ${(r.weaknesses||[]).map(EC.esc).join('; ')}</p>${(r.errors||[]).map(e=>`<p>${EC.diffHtml(e.original,e.correction)}<br><span class="muted">${EC.esc(e.explanation)}</span></p>`).join('')}</div><button class="primary" onclick="intro()">Continue</button>`;
    } catch(e){ out.innerHTML = `<p class="err">${EC.esc(e.message)}</p>`; }
    go.disabled = false;
  };
}

// 4. Fala: entrevista com a Enma
function speaking(){
  const hist = [{ role:'user', content:'Hello, I am ready for the interview.' }]; let turns = 0;
  app.innerHTML = `<h1>Speaking interview</h1><p class="hint">Four short stages: <b>1</b> about you, <b>2</b> a talk of about one minute on a past experience, <b>3</b> your opinion, <b>4</b> defending a position. Click "Speak", answer, and wait for the pause. Enma does not correct you during the interview. You can also type.</p><p class="pill" id="stage" aria-live="polite">Stage 1 of 4</p><div id="log"></div><p class="err" id="st"></p><div class="row"><button class="primary" id="mic">Speak</button><input type="text" id="tx" placeholder="Or type…"><button id="snd">Send</button><button id="fin">Finish and assess</button><button type="button" id="bk">← Back to parts</button></div><div id="out"></div>`;
  bk.onclick = () => leave(turns > 0);
  const add = (w,t) => { log.insertAdjacentHTML('beforeend', `<div class="card"><b>${w}</b><br>${EC.esc(t)}</div>`); };
  const turn = async () => {
    st.textContent = 'Enma is thinking…';
    try { const d = await EC.api('/api/chat', { messages: hist, phase:'placement' }); hist.push({ role:'assistant', content:d.text }); add('Enma', d.text); if (st.textContent.startsWith('Enma')) st.textContent=''; await EC.speak(d.text); }
    catch(e){ st.textContent = e.message; hist.pop(); }
  };
  const say = t => { t=t.trim(); if(!t) return; tx.value=''; hist.push({ role:'user', content:t }); add('You', t); turns++; stage.textContent = 'Stage ' + Math.min(turns + 1, 4) + ' of 4' + (turns >= 4 ? ' (you can finish now)' : ''); turn(); };
  mic.onclick = async () => { mic.disabled = true; st.textContent = ''; try { const r = await EC.listen({ btn: mic, st }); say(r.text); } catch(e){ st.textContent = e.message; } mic.disabled = false; };
  snd.onclick = () => say(tx.value);
  fin.onclick = async () => {
    stopTimer();
    out.innerHTML = '<p class="muted">Assessing…</p>';
    try {
      const m = await markTwice('placement_speaking', { transcript: hist }), r = m.r;
      res.speaking = { score: m.score, cefr: m.cefr, data: r }; EC.set(DRAFT, res); EC.addErrors(r.errors, 'prova-' + EC.today());
      out.innerHTML = `<div class="card"><b>Speaking level: ${EC.esc(m.cefr)}</b>${crit(r.scores)}<p>${(r.strengths||[]).map(EC.esc).join('; ')}</p><p>${(r.weaknesses||[]).map(EC.esc).join('; ')}</p></div><button class="primary" onclick="intro()">Continue</button>`;
    } catch(e){ out.innerHTML = `<p class="err">${EC.esc(e.message)}</p>`; }
  };
  startTimer(10, () => { if (turns > 0) fin.click(); else intro(); });
  turn();
}

// Resultado final
function result(){
  const parts = [['Grammar and vocabulary', res.grammar], ['Reading', res.reading], ['Writing', res.writing], ['Speaking', res.speaking]];
  const done = parts.filter(p => p[1]);
  if (!done.length) { app.innerHTML = '<p>Please complete at least one part first.</p><button onclick="intro()">Back</button>'; return; }
  const avg = done.reduce((a,p)=>a+p[1].score,0)/done.length;
  const overall = label(avg);
  // Faixa provável: um teste curto não tem precisão de um nível exato; a faixa aumenta se as partes divergem ou se poucas foram feitas
  const sd = done.length > 1 ? Math.sqrt(done.reduce((a,p)=>a+(p[1].score-avg)**2,0)/done.length) : 0, dd = Math.max(.35, sd, done.length < 3 ? .5 : 0);
  const rLo = label(Math.max(0, avg - dd)), rHi = label(Math.min(3, avg + dd)), range = rLo === rHi ? overall : rLo + ' to ' + rHi;
  const hs2 = EC.get('level_history', []), prev2 = hs2.length ? hs2[hs2.length-1] : null;
  const trend = (CP && prev2) ? (avg > prev2.avg + .15 ? '▲ up from ' : avg < prev2.avg - .15 ? '▼ down from ' : '= same as ') + prev2.overall : '';
  app.innerHTML = `<h1>${CP ? 'Checkpoint result · week ' + CP : 'Result'}</h1><div class="card"><h2 style="margin-top:0">Estimated overall level: ${EC.esc(overall)}</h2><p class="hint">Likely range: <b>${EC.esc(range)}</b>. A short test gives an estimate, not an exact level.</p>${trend ? `<p><b>${trend}</b> (last time)</p>` : ''}
   <table>${parts.map(([n,p]) => `<tr><td>${n}</td><td>${p ? EC.esc(p.cefr || label(p.score)) : '<span class="muted">not taken</span>'}</td></tr>`).join('')}<tr><td>Listening comprehension</td><td class="muted">take the free EF SET below</td></tr></table>
   ${done.length < 4 ? '<p class="hint">Partial result: complete the other parts for a more reliable estimate.</p>' : ''}</div>
   <div class="card" ${CP ? 'style="display:none"' : ''}><b>Listening: free EF SET test</b><p>This app does not test listening yet, so use the free EF SET. Take the <b>listening</b> test (about 25 minutes) and, if you like, the <b>reading</b> test.</p><p><a class="btn" href="https://www.efset.org/" target="_blank" rel="noopener">Open EF SET (new tab)</a></p><label>EF SET listening level</label><select id="extL"><option value="">—</option>${['A1','A2','B1','B2','C1','C2'].map(l=>`<option>${l}</option>`).join('')}</select><label>EF SET reading level (optional)</label><select id="ext"><option value="">—</option>${['A1','A2','B1','B2','C1','C2'].map(l=>`<option>${l}</option>`).join('')}</select><p class="hint">You can fill this in later: the levels are saved with your plan.</p></div>
   <div id="fbHere"></div>
   <div class="row"><button class="primary" id="save">${CP ? 'Save checkpoint' : 'Save and create my plan'}</button><button onclick="intro()">Back</button></div>`;
  EC.askFeedback(document.getElementById('fbHere'), 'placement', 'Does this level estimate feel right to you?', overall);
  save.onclick = () => {
    if (CP) {
      const hist = EC.get('level_history', []); hist.push({ date: EC.today(), overall, avg, checkpoint: CP }); EC.set('level_history', hist);
      const cps = EC.get('checkpoints', {}); cps[CP] = { date: EC.today(), overall, avg };
      EC.checkpointList().forEach(c => { if (c.week < CP && !c.done) cps[c.week] = { skipped: true, date: EC.today() }; }); EC.set('checkpoints', cps); EC.set(DRAFT, {}); location.href = 'plano.html'; return;
    }
    EC.set('level', { overall, avg, date: EC.today(), parts: Object.fromEntries(parts.map(([n,p]) => [n, p ? (p.cefr || label(p.score)) : null])), external: ext.value || null, listening: extL.value || null });
    const hist = EC.get('level_history', []); hist.push({ date: EC.today(), overall, avg }); EC.set('level_history', hist);
    EC.set(DRAFT, {}); location.href = EC.get('interests', null) ? 'plano.html' : 'interesses.html';
  };
}
intro();
</script>
