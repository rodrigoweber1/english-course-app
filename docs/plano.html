<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plan · English Course</title>
<link rel="stylesheet" href="common.css">
<link rel="stylesheet" href="theme.css">
</head>
<body>
<div class="wrap" id="app"></div>
<script src="config.js"></script>
<script src="common.js"></script>
<script>
EC.nav('plano.html');
const app = document.getElementById('app');
const level = EC.get('level', null), s = EC.settings();
const sessions = EC.get('sessions', []), vocab = EC.get('vocab', []), cards = EC.get('cards', []);
const hist = EC.get('level_history', []);
const fmt = d => d.toLocaleDateString('en-GB');
let html = '<h1>My plan</h1>';

if (!level) {
  html += `<div class="card"><p>There is no placement test result yet. Your plan depends on it (upper B1, B2, upper B2 or C1).</p><a class="btn primary" href="prova.html">Take the placement test</a></div>
  <p class="hint">In the meantime, here is the standard 48-week plan for upper B2.</p>`;
}
const p = EC.plan(level, s);
const wk = Math.min(p.total, EC.weekNow(p, s));
html += `<div class="card"><b>Starting level:</b> ${EC.esc(level?.overall || 'B2+ (default)')}${level?.external ? ' · EF SET reading: ' + EC.esc(level.external) : ''}${level?.listening ? ' · EF SET listening: ' + EC.esc(level.listening) : ''}<br>
<b>Cycle:</b> ${p.total} weeks, from ${fmt(p.start)} to ${fmt(p.end)}${p.paused ? ` (includes ${p.paused} days of pause)` : ''}<br>
<b>Now:</b> week ${wk} of ${p.total}
<div class="pbar" style="margin-top:8px"><i style="width:${wk/p.total*100}%"></i></div>
${p.minimum ? '' : '<p class="err">You have fewer than 2 lessons a week. The cycle has been lengthened.</p>'}
${!s.planStart ? '<p class="hint">Save your settings to fix the start date.</p>' : ''}</div>`;

// Sugestão (só sugere; o aluno decide)
const sg = EC.planSuggestion(), tr = EC.scoreTrend(), pa = EC.get('planAdjust', {});
if (sg) {
  html += `<div class="card" id="sugg" style="border-color:var(--primary)"><b>Suggestion</b><p>${sg.kind === 'faster'
    ? `Your lesson scores are going up: your last 3 lessons averaged <b>${sg.recent}/10</b> (the 3 before: ${sg.prev}/10). Would you like to move <b>one week ahead</b> in the plan?`
    : `Your last 3 lessons averaged <b>${sg.recent}/10</b> (the 3 before: ${sg.prev}/10). Would you like to spend <b>one extra week</b> consolidating?`}</p>
  <p class="hint">This only moves the week counter and the end date. Nothing else changes, and you can undo it.</p>
  <div class="row"><button class="primary" id="sgYes">${sg.kind === 'faster' ? 'Yes, move ahead one week' : 'Yes, add one week'}</button><button id="sgNo">Not now</button></div></div>`;
} else if (pa.accepted && pa.undoDays && Date.now() - pa.lastAt < 14*864e5) {
  html += `<div class="card"><p>Plan adjusted: ${pa.kind === 'faster' ? 'moved one week ahead' : 'one extra week added'}.</p><button id="sgUndo">Undo</button></div>`;
}

// Fases
let acc = 0;
html += '<h2>Phases</h2><table>' + p.phases.map(ph => { const a = acc + 1, b = acc + ph.weeks; acc = b; const cur = wk >= a && wk <= b; return `<tr><td>${cur ? '<b>▶ ' : ''}${EC.esc(ph.name)}${cur ? '</b>' : ''}</td><td>weeks ${a}–${b}</td></tr>`; }).join('') + '</table>';

// Esta semana
const days = [1,2,3,4,5,6,0];
const today = new Date().getDay();
html += '<h2>This week</h2><table>';
let ci = 0;
for (const d of days) {
  const t = s.classes[d], items = [];
  if (t) items.push(`Lesson ${t} · ${EC.TYPES[ci++ % 3]}`);
  if ((s.listen.days || []).includes(d)) items.push(`Free listening ${s.listen.time}`);
  if (s.write.day === d) items.push(`Writing ${s.write.time}`);
  html += `<tr><td>${d === today ? '<b>' : ''}${EC.DAYS[d]}${d === today ? '</b>' : ''}</td><td>${items.join(' · ') || '<span class="muted">rest day</span>'}</td></tr>`;
}
html += '</table>';

// Provas de checkpoint
const cps = level ? EC.checkpointList() : [], cdue = EC.checkpointDue();
html += '<h2>Progress tests</h2><p class="hint">Checkpoint tests in weeks 8, 16, 24, 32 and 40 of the cycle, plus a final assessment. Each one uses the same format as the placement test and compares your level with the last one. They never change your plan.</p>';
if (!level) html += '<p class="hint">They unlock after the placement test.</p>';
else html += '<p>' + cps.map(c => `<span class="pill">${c.final ? 'Final' : 'Week ' + c.week}${c.done ? (c.done.skipped ? ' · skipped' : ' ✓ ' + EC.esc(c.done.overall)) : c.due ? ' · due' : ''}</span>`).join(' ') + '</p>';
if (cdue) html += `<div class="card" style="border-color:var(--primary)"><b>${cdue.final ? 'Final assessment' : 'Checkpoint test · week ' + cdue.week} is available</b><p>About 30 minutes. It is a good moment to measure your progress.</p><a class="btn primary" href="prova.html?checkpoint=${cdue.week}">Start the test</a></div>`;

// Progresso
const minutes = sessions.reduce((a,x)=>a+(x.minutes||0),0), spoken = sessions.reduce((a,x)=>a+(x.userMin||0),0);
const mastered = vocab.filter(v => (v.uses||0) >= 3).length;
const thisWeek = sessions.filter(x => (new Date() - new Date(x.date)) / 864e5 < 7).length;
html += `<h2>Progress</h2><div class="card"><table>
<tr><td>Lessons completed</td><td>${sessions.length} (this week: ${thisWeek})</td></tr>
<tr><td>Lesson minutes / minutes you spoke</td><td>${Math.round(minutes)} / ${Math.round(spoken)}</td></tr>
<tr><td>Expressions learning / mastered</td><td>${vocab.length - mastered} / ${mastered}</td></tr>
<tr><td>Grammar cards</td><td>${cards.length}</td></tr>
<tr><td>C1 inventory you already use</td><td>${EC.c1Status().pct}%</td></tr>
<tr><td>Lesson scores (last 6)</td><td>${tr ? tr.last.join(' · ') + ' /10' : '<span class="muted">after 6 scored lessons</span>'}</td></tr>
<tr><td>Persistent errors</td><td>${EC.persistentErrors().length}</td></tr>
<tr><td>Outside listening logged</td><td>${EC.get('outside', []).reduce((a,x)=>a+x.min,0)} min</td></tr></table>
${hist.length ? '<p><b>Level history:</b> ' + hist.map(h => `${fmt(new Date(h.date))}: ${EC.esc(h.overall)}`).join(' → ') + '</p>' : ''}</div>
<div class="row"><a class="btn" href="ajustes.html">Change days and reminders</a><a class="btn" href="prova.html">Placement test</a></div>`;
app.innerHTML = html;
const reload = () => location.reload();
if (sg) { document.getElementById('sgYes').onclick = () => { EC.answerSuggestion(sg, true); reload(); }; document.getElementById('sgNo').onclick = () => { EC.answerSuggestion(sg, false); reload(); }; }
const un = document.getElementById('sgUndo');
if (un) un.onclick = () => { EC.shiftPlan(-pa.undoDays); EC.set('planAdjust', { ...pa, accepted:false, undoDays:0 }); reload(); };
</script>
</body>
</html>
